version: "3.9"
services:
  customer-microservice-db:
    image: postgres:16.0
    container_name: spring_prep
    environment:
      POSTGRES_DB: scbt
      POSTGRES_USER: scbt
      POSTGRES_PASSWORD: scbt
    restart: always
    volumes:
      - spring_prep:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  spring_prep: